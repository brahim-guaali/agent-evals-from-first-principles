[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-evals-from-first-principles"
version = "0.1.0"
description = "Evals for a production AI agent: annotation, checks read from traces, a calibrated LLM judge, online evals, a release gate."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "google-genai>=1.30,<3",
    "pydantic>=2.7",
    "langgraph>=1.0",
    "langgraph-checkpoint-sqlite>=2.0",
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
    "opentelemetry-exporter-otlp-proto-http==1.45.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
viz = ["matplotlib>=3.8", "pillow>=10"]

[tool.setuptools]
packages = ["agent", "agentkit", "evals", "services"]

[tool.pytest.ini_options]
testpaths = ["tests"]
