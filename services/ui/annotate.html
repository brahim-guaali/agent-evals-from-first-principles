<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Label runs</title>
<style>
:root { --bg: #f4f4f2; --surface: #fcfcfb; --surface-2: #f0efec; --border: #e1e0db; --text: #0b0b0b; --text-2: #52514e;
  --accent: #2a78d6; --good: #0ca30c; --bad: #d03b3b; --mono: ui-monospace, SFMono-Regular, Menlo, monospace; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #111110; --surface: #1a1a19;
  --surface-2: #232321; --border: #33332f; --text: #ffffff; --text-2: #c3c2b7; --accent: #4b93ea; } }
:root[data-theme="dark"] { --bg: #111110; --surface: #1a1a19; --surface-2: #232321; --border: #33332f; --text: #ffffff;
  --text-2: #c3c2b7; --accent: #4b93ea; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
header { display: flex; gap: 12px; align-items: center; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
header h1 { font-size: 15px; margin: 0; }
header .p { margin-left: auto; font-size: 13px; color: var(--text-2); }
main { max-width: 860px; margin: 0 auto; padding: 16px; display: grid; gap: 12px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
.card h2 { font-size: 12px; margin: 0 0 8px; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; }
.msg { white-space: pre-wrap; }
.kv { display: grid; grid-template-columns: 140px 1fr; gap: 4px 12px; font-size: 13.5px; }
.kv div:nth-child(odd) { color: var(--text-2); }
.q { margin: 10px 0; }
.q .t { margin-bottom: 6px; }
.opts { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: inherit; padding: 8px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); cursor: pointer; min-width: 64px; }
button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
button.save { background: var(--accent); color: #fff; border-color: var(--accent); width: 100%; padding: 12px; }
textarea { width: 100%; font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--text); min-height: 54px; }
details { font-size: 13px; color: var(--text-2); }
.flag { color: var(--bad); }
@media (max-width: 560px) { .kv { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header><h1>Label runs</h1><span class="p" id="progress"></span></header>
<main id="main"><div class="card">Loading…</div></main>
<script>
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const annotator = new URLSearchParams(location.search).get("annotator") || "brahim";
let schema = {}, item = null, answers = {};

async function load() {
  schema = await (await fetch("/annotations/schema")).json();
  const r = await (await fetch(`/annotations/next?annotator=${annotator}`)).json();
  document.getElementById("progress").textContent = `${r.done} labelled · ${r.left} left`;
  item = r.item; answers = {};
  if (!item) { document.getElementById("main").innerHTML = `<div class="card">Nothing left to label. Thank you.</div>`; return; }
  const s = item.snapshot, d = s.decision || {}, o = s.order || {};
  const clause = d.clause && s.policy[d.clause] ? `${d.clause}: ${s.policy[d.clause]}` : d.clause;
  document.getElementById("main").innerHTML = `
  <div class="card"><h2>Customer wrote</h2><div class="msg">${esc(s.message)}</div></div>
  <div class="card"><h2>Agent replied</h2><div class="msg">${esc(s.reply)}</div>
    ${s.correction ? `<p class="flag">Then sent a correction: ${esc(s.correction)}</p>` : ""}</div>
  <div class="card"><h2>What the agent knew and decided</h2><div class="kv">
    <div>decision</div><div>${s.path === "decided" ? `${esc(d.action)} $${d.amount ?? 0} · ${esc(clause)}` : esc(s.path)}</div>
    <div>reason</div><div>${esc(d.reason)}</div>
    ${s.manager_approval ? `<div>manager</div><div>${esc(s.manager_approval)}</div>` : ""}
    <div>order</div><div>${o.order_id ? `${esc(o.order_id)} · $${o.total} · ${o.minutes_late} min late · ${esc(o.status)}<br>${(o.items || []).map(i => `${esc(i.name)} $${i.price}${i.qty > 1 ? " ×" + i.qty : ""}`).join(", ")}` : "–"}</div>
    <div>fraud score</div><div>${s.fraud_score ?? "–"}${s.fraud_review ? ` · review: ${esc(s.fraud_review.risk)}` : ""}</div>
    <div>history</div><div>${s.history.refunds_30d ?? 0} refunds in 30 days${(s.history.refunded_orders || []).length ? ` · already refunded: ${esc(s.history.refunded_orders.join(", "))}` : ""}</div>
    ${s.guardrails.length ? `<div>guardrails</div><div class="flag">${s.guardrails.map(g => `${esc(g.check)}: ${esc(JSON.stringify(g.evidence))}`).join("<br>")}</div>` : ""}
    ${s.failures.length ? `<div>failures</div><div class="flag">${s.failures.map(f => `${esc(f.service)} ${esc(f.kind)}`).join(", ")}</div>` : ""}
  </div><details><summary>Refund policy and FAQ</summary>${Object.entries({...s.policy, ...s.faq}).map(([k, v]) => `<div><b>${esc(k)}</b> ${esc(v)}</div>`).join("")}</details></div>
  <div class="card"><h2>Your labels · queued because: ${esc(item.reason)}</h2>
    ${Object.entries(schema).map(([k, q]) => `<div class="q"><div class="t">${esc(q.question)}</div><div class="opts" data-k="${k}">
      ${(q.type === "bool" ? [["yes", true], ["no", false]] : q.options.map(o => [o, o])).map(([l, v]) => `<button data-v='${JSON.stringify(v)}'>${l}</button>`).join("")}
    </div></div>`).join("")}
    <div class="q"><div class="t">Notes (optional)</div><textarea id="notes"></textarea></div>
    <button class="save" id="save">Save and next</button>
  </div>`;
  document.querySelectorAll(".opts button").forEach(b => b.onclick = () => {
    const k = b.parentElement.dataset.k; answers[k] = JSON.parse(b.dataset.v);
    b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b));
  });
  document.getElementById("save").onclick = save;
}

async function save() {
  const missing = Object.keys(schema).filter(k => !(k in answers));
  if (missing.length) { alert("Answer every question first: " + missing.join(", ")); return; }
  await fetch("/annotations/labels", {method: "POST", headers: {"content-type": "application/json"},
    body: JSON.stringify({item_id: item.item_id, annotator, labels: answers, notes: document.getElementById("notes").value})});
  load();
}
load();
</script>
</body>
</html>
